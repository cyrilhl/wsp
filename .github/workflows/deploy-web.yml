name: Build and deploy web app

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Build web app and offline cache
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: sh tool/build_web.sh --base-href "${BASE_PATH}/"

      - run: node --test tool/web_tests.cjs

      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
